
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AestheticSnapshot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #ff729c;
            color: #fff4b3;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 7%;
            border-bottom: 0px solid #fff4b3;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: -1px;
        }

        nav {
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        main {
            max-width: 900px;
            margin: 90px auto;
            padding: 20px;
            text-align: center;
        }

        .eyebrow {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        h1 {
            margin: 24px 0;
            font-family: Georgia, serif;
            font-size: clamp(42px, 8vw, 78px);
            font-weight: bold;
            letter-spacing: -5px;
        
        }

        .intro {
            max-width: 420px;
            margin: 0 auto;
            color: #fff4b3;
            font-size: 15px;
            line-height: 1.8;
        }

        .camera {
            width: 190px;
            height: 145px;
            margin: 45px auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0px solid #b8b6af;
            border-radius: 18px;
            background: #d6d0d4;
            box-shadow: 0 12px 30px #0000000d;
            font-size: 55px;
        }

        .start-button {
            display: inline-block;
            padding: 16px 34px;
            border: none;
            border-radius: 4px;
            background: #292929;
            color: white;
            font-size: 12px;
            letter-spacing: 2px;
            text-decoration: none;
            text-transform: uppercase;
            cursor: pointer;
        }

        
.start-button {
    display: inline-block;
    background-color: #fff4b3;
    color: #ff729c;
    font-family: Georgia, serif;
    font-size: 18px;
    padding: 12px 24px;
    border: none;
    border-radius: 25px;
    text-decoration: none;
    cursor: pointer;
    margin: 15px;
    transition: transform 0.2s ease;
}

.start-button:hover {
    transform: scale(1.05);
}


        footer {
            padding: 25px;
            text-align: center;
            color: #fff4b3;
            font-size: 11px;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">AestheticSnapshot.</div>
        <nav>YOUR DIGITAL PHOTOBOOTH</nav>
    </header>

    <main>
        <p class="eyebrow">A little moment, forever yours</p>

        <h1>Memories fade,<br>Snapshots don't.</h1>

        <p class="intro">
            Capture the little things. Create your own photo strips
            and turn everyday moments into something worth keeping.
        </p>

        <div class="camera">📸</div>

       <a href="photobooth.html" class="start-button">Enter the Photobooth 💗</a>
        
    </main>

    <footer>
        MADE FOR YOUR LITTLE MOMENTS © 2026
    </footer>

</body>
</html>
